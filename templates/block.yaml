# Положите копию в docs/architecture/blocks/<компонент>/<блок>.yaml и замените все <…>.
# Незаменённое значение считается незаполненным. Лишние для вида блока поля удалите.
id: <компонент>-<блок>
title: <Название>
kind: service # service | ui | storage | config
does:
- <глагол: что делает блок>
tech: <имя и версия точно как в stack.yaml>
stories:
- '<номер истории, например 1.1>'
io:
- dir: in # in | out
  with: <с кем>
  what: <модель или данные>
  via: <код интерфейса, поле можно удалить для вызова внутри компонента>
data: 'нет: <почему у блока нет таблиц>' # либо список
# data:
# - table: <имя таблицы, не код хранилища>
#   access: read # read | write | read-write
#   why: <для чужой таблицы: кто владелец>
params: 'нет: <почему у блока нет настроек>' # либо список имён из params.yaml
reqs:
- <FR-1 или NFR-1>
tasks:
- '<номер истории с готовым файлом спецификации>'
on_failure: <что происходит при отказе блока и зависимостей>
why: <1–2 предложения: почему блок устроен так>
# Вид service
operations:
- name: <эндпоинт или функция>
  caller: <кто вызывает>
  via: <код интерфейса или «внутри»>
# Вид ui
# screens:
# - path: <путь в интерфейсе>
#   shows: <поля и действия>
#   operation: <операция API, обязательна для статусов «новое» и «доработка»>
#   status: новое # есть | доработка | новое
#   file: <файл в коде>
#   story: '<номер истории>'
# Вид storage и config
# schema_ref: <ссылка на модель данных или конфиг>
