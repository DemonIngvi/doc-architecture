$schema: https://json-schema.org/draft/2020-12/schema
title: Функция системы
type: object
required:
- id
- title
- owner
- lifecycle
- criticality
- system
- reqs
- reads
- writes
additionalProperties: false
properties:
  id:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9-]*$
  title:
    type: string
    minLength: 2
  owner:
    type: string
    minLength: 2
  lifecycle:
    enum:
    - planned
    - active
    - deprecated
    - retired
  criticality:
    enum:
    - low
    - medium
    - high
  system:
    type: string
    minLength: 2
  reqs:
    type: array
    items:
      type: string
  reads:
    type: array
    items:
      type: string
  writes:
    type: array
    items:
      type: string
