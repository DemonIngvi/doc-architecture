$schema: https://json-schema.org/draft/2020-12/schema
title: 'Компонент: контейнер внутри системы'
type: object
required:
- id
- title
- owner
- lifecycle
- criticality
- system
- responsibility
additionalProperties: false
properties:
  id:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9-]*$
  title:
    type: string
    minLength: 2
  owner:
    type: string
    minLength: 2
  lifecycle:
    enum:
    - planned
    - active
    - deprecated
    - retired
  criticality:
    enum:
    - low
    - medium
    - high
  system:
    type: string
    minLength: 2
  responsibility:
    type: string
    minLength: 2
  tech:
    type: string
    minLength: 2
  functions:
    type: array
    items:
      type: string
  host:
    type: string
  purpose:
    type: string
  does:
    type: array
    items:
      type: string
  chain:
    type: array
    items:
      type: string
