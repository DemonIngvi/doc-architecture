$schema: https://json-schema.org/draft/2020-12/schema
title: 'Бизнес-процесс: вход, шаги, выход'
type: object
required:
- id
- title
- owner
- lifecycle
- criticality
- trigger
- actors
- inputs
- outputs
- steps
additionalProperties: false
properties:
  id:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9-]*$
  title:
    type: string
    minLength: 2
  owner:
    type: string
    minLength: 2
  lifecycle:
    enum:
    - planned
    - active
    - deprecated
    - retired
  criticality:
    enum:
    - low
    - medium
    - high
  trigger:
    type: string
    minLength: 2
  actors:
    type: array
    items:
      type: string
  inputs:
    type: array
    items:
      type: string
  outputs:
    type: array
    items:
      type: string
  journeys:
    type: array
    items:
      type: string
  steps:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - title
      - actor
      - inputs
      - outputs
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 2
        actor:
          type: string
          minLength: 2
        function:
          type: string
          minLength: 2
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        id:
          type: string
        type:
          enum:
          - start
          - task
          - gateway
          - error
          - end
        next:
          type: array
          items:
            type: object
            required:
            - to
            additionalProperties: false
            properties:
              to:
                type: string
              label:
                type: string
  component:
    type: string
  stories:
    type: array
    items:
      type: string
