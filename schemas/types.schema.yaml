$schema: https://json-schema.org/draft/2020-12/schema
title: Словари типов
type: object
required:
- system_kind
- integration_type
- flow_type
- data_class
- sensitivity
additionalProperties: false
properties:
  system_kind:
    type: array
    minItems: 1
    items:
      type: string
  integration_type:
    type: array
    minItems: 1
    items:
      type: string
  flow_type:
    type: array
    minItems: 1
    items:
      type: string
  data_class:
    type: array
    minItems: 1
    items:
      type: string
  sensitivity:
    type: array
    minItems: 1
    items:
      type: string
