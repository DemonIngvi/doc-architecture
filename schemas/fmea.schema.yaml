$schema: https://json-schema.org/draft/2020-12/schema
title: Режимы отказа
type: object
required: [rows]
additionalProperties: false
properties:
  rows:
    type: array
    items:
      type: object
      required: [target, failure, detection, behavior, recovery]
      additionalProperties: false
      properties:
        target: {type: string, description: Код интеграции, хранилища или компонента}
        failure: {type: string}
        detection: {type: string}
        behavior: {type: string}
        recovery: {type: string}
