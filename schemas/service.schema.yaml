$schema: https://json-schema.org/draft/2020-12/schema
title: 'Сервис: что и на каких условиях получает потребитель'
type: object
required:
- id
- title
- owner
- lifecycle
- criticality
- consumers
- provider
- functions
- objectives
additionalProperties: false
properties:
  id:
    type: string
    pattern: ^[A-Za-z][A-Za-z0-9-]*$
  title:
    type: string
    minLength: 2
  owner:
    type: string
    minLength: 2
  lifecycle:
    enum:
    - planned
    - active
    - deprecated
    - retired
  criticality:
    enum:
    - low
    - medium
    - high
  consumers:
    type: array
    items:
      type: string
  provider:
    type: string
    minLength: 2
  functions:
    type: array
    items:
      type: string
  objectives:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - text
      - quality
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 2
        quality:
          type: string
          description: Сценарий из quality.yaml
