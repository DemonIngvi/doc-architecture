$schema: https://json-schema.org/draft/2020-12/schema
title: Интерфейс между компонентами
type: object
required: [id, from, to, purpose, protocol, auth, timeout, retry, idempotent]
additionalProperties: false
properties:
  id: {type: string, pattern: '^I\d+$'}
  from: {type: string}
  to: {type: string}
  purpose: {type: string}
  protocol: {type: string}
  format: {type: string}
  auth: {type: string}
  mode: {enum: [sync, async]}
  timeout: {type: string}
  retry: {type: string}
  idempotent: {type: boolean}
  models:
    type: array
    items: {type: string}
